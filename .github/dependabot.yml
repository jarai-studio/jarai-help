# .github/dependabot.yml
#
# Continuous dependency-vulnerability management. Dependabot runs on GitHub's own
# infrastructure (no Actions minutes), opening PRs for security patches and weekly
# version bumps. Grouped non-major updates keep PR volume low.
#
# Repo-level "Dependabot alerts" + "Dependabot security updates" must also be ON
# (GitHub → Settings → Code security — operator, one-time).
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: ["dependencies", "security"]
    commit-message:
      prefix: "deps"
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      # typescript 7.x (native/Go-ported compiler) isn't supported yet by @astrojs/check@0.9.10,
      # whose peerDependencies caps at "^5.0.0 || ^6.0.0" (checked 2026-08-06, latest @astrojs/check
      # release). Closing PR #56 alone doesn't stop this — each new 7.x patch is a distinct version
      # Dependabot will re-propose. Remove once @astrojs/check/@volar/kit add TS7 support.
      - dependency-name: "typescript"
        versions: ["7.x"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: ["dependencies", "security", "ci"]
    commit-message:
      prefix: "deps(actions)"
    groups:
      actions-all:
        patterns: ["*"]
